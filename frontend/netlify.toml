# NOTE: redirects are deliberately NOT declared here.
#
# Netlify applies netlify.toml redirects globally; they are not context-aware,
# so a "[context.deploy-preview]" redirect block is silently ignored and every
# deploy context ends up using whichever "/api/*" rule was declared first. That
# previously sent pull request previews at the production backend.
#
# The /api/* proxy and the SPA fallback are emitted into build/_redirects at
# build time instead, where the deploy context is known. See the
# `netlifyRedirects` plugin in vite.config.ts.

[[headers]]
for = "/*"
[headers.values]
Document-Policy = "js-profiling"
