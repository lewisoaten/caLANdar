# .kodiak.toml
# Minimal config. version is the only required field.
version = 1

[merge]
method = "rebase_fast_forward"
delete_branch_on_merge = true

[merge.automerge_dependencies]
# only auto merge "minor" and "patch" version upgrades.
# do not automerge "major" version upgrades.
versions = ["minor", "patch"]
# These are GraphQL logins, NOT the REST ones. Kodiak reads pull requests via
# GitHub's GraphQL API, where a GitHub App author is a `Bot` whose `login` has
# no "[bot]" suffix - "dependabot", not "dependabot[bot]". The REST API reports
# the suffixed form, so copying a login from a REST response or from the web UI
# gives a value that never matches. Verified against the GraphQL API for both.
usernames = ["dependabot", "pre-commit-ci"]

[update]
# Leave Dependabot's branches alone. Dependabot already runs with
# rebase-strategy "auto" for every ecosystem, so it will keep its own pull
# requests rebased on main and ready to merge - but only while it still
# recognises the branch as its own. Kodiak updating a branch (a "Merge branch
# 'main' into dependabot/..." commit) makes Dependabot treat it as edited by
# someone else, after which it refuses both to rebase it *and* to bump it to
# newer releases, so the PR silently rots at an old version.
#
# GraphQL login, for the same reason as merge.automerge_dependencies.usernames
# above: no "[bot]" suffix.
ignored_usernames = ["dependabot"]
