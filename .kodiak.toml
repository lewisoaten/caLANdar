# .kodiak.toml
# Minimal config. version is the only required field.
version = 1

[merge]
method = "rebase_fast_forward"
delete_branch_on_merge = true

[merge.automerge_dependencies]
# only auto merge "minor" and "patch" version upgrades.
# do not automerge "major" version upgrades.
versions = ["minor", "patch"]
# These are GraphQL logins, NOT the REST ones. Kodiak reads pull requests via
# GitHub's GraphQL API, where a GitHub App author is a `Bot` whose `login` has
# no "[bot]" suffix - "dependabot", not "dependabot[bot]". The REST API reports
# the suffixed form, so copying a login from a REST response or from the web UI
# gives a value that never matches. Verified against the GraphQL API for both.
usernames = ["dependabot", "pre-commit-ci"]
