name: Frontend CI

on:
  push:
    branches: [main, staging, trying]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  # No `paths` filter on pull_request, deliberately. This job ("test") is a
  # required status check on main, and GitHub blocks a pull request forever
  # when a required check never reports. With a paths filter, any PR that does
  # not touch frontend/** - an api-only dependency bump, a config change -
  # would wait on a check that never runs. Pushes stay filtered; PRs gate main.
  pull_request:
    branches: ["main"]

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: frontend/storybook-static
          retention-days: 7

  # Optional: Add Storybook test-runner job once configured
