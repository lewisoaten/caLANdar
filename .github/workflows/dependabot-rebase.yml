name: Rebase next Dependabot PR

# Kodiak merges with "rebase_fast_forward", which its docs require to be paired
# with "Require branches to be up to date before merging". Every merge therefore
# leaves every other open PR behind main and unmergeable until something rebases
# it, and `update.ignored_usernames` in .kodiak.toml deliberately stops Kodiak
# from being that something - when Kodiak updates a branch, Dependabot disowns
# it and stops bumping it to newer releases, so the PR rots at an old version.
#
# That leaves nobody: Dependabot does not rebase a PR merely for being behind,
# only for conflicts. (Measured here: PRs it has always owned sat up to 29
# commits and six months behind without ever being rebased.)
#
# So ask it to, which keeps the branch Dependabot-owned. This is Kodiak's own
# unimplemented "update by comment" strategy, chdsbd/kodiak#438, from outside.

on:
  push:
    branches: [main]
  # A merge is not the only thing that makes a PR eligible. Adding the
  # automerge label does too, and without this the labelled PR sits until some
  # unrelated merge happens to wake the workflow - which, with the minor/patch
  # queue drained, may be never.
  #
  # pull_request_target rather than pull_request: it runs in the context of the
  # base branch with this repository's secrets. That is safe here only because
  # this workflow never checks out or executes code from the pull request - it
  # reads PR metadata through the API and posts a comment. Keep it that way.
  pull_request_target:
    types: [labeled]
  # Safety net for everything else that can change eligibility without a merge
  # or a label: a failing check going green, a merge state left UNKNOWN past
  # the polling window, a recreate finishing after the run that requested it.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # `gh pr comment` posts to the issues comments endpoint. Whether
  # pull-requests:write alone authorises that is ambiguous in the docs, and the
  # failure mode is a 403 that looks like "nothing to do", so grant both.
  issues: write

concurrency:
  group: dependabot-rebase
  cancel-in-progress: false

jobs:
  rebase-next:
    # Only the automerge label makes a PR newly eligible; ignore other labels.
    if: >-
      github.event_name != 'pull_request_target'
      || github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    steps:
      - name: Check the rebase token is configured
        env:
          REBASE_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
        run: |
          if [ -z "${REBASE_TOKEN}" ]; then
            echo "::error::DEPENDABOT_REBASE_TOKEN is not set."
            echo "Dependabot refuses comment commands from github-actions[bot]:"
            echo '  "Sorry, only users with push access can use that command."'
            echo "That is Dependabot's own identity check, so the default"
            echo "GITHUB_TOKEN cannot work here no matter what permissions it"
            echo "is granted. Provide a PAT or GitHub App token with push"
            echo "access as the DEPENDABOT_REBASE_TOKEN secret."
            exit 1
          fi

      - name: Pick the next mergeable out-of-date Dependabot PR
        id: pick
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Match the author loosely. The same bot is spelled three ways
          # depending on the interface: "dependabot" via GraphQL,
          # "dependabot[bot]" via REST, "app/dependabot" via the gh CLI. A
          # filter matching none of them is indistinguishable from "no work".
          #
          # GitHub computes mergeStateStatus lazily. Querying it starts the
          # computation and returns UNKNOWN until that finishes, and this
          # workflow runs seconds after a merge invalidates every open PR. So
          # poll until the states settle: on the very first real run every PR
          # was UNKNOWN, the BEHIND filter matched nothing, and the job
          # reported "nothing to do" while the queue sat still - a silent
          # no-op of exactly the kind the token guard exists to prevent. The
          # same filter found eleven candidates a minute later.
          unknown=0
          for attempt in $(seq 1 12); do
            gh pr list --repo "$REPO" --state open --limit 100 \
              --json number,title,body,author,mergeStateStatus,createdAt,statusCheckRollup,labels \
              --jq '[ .[]
                      | select(.author.login
                               | test("(^|/)dependabot(\\[bot\\])?$")) ]' \
              > all.json

            unknown="$(jq '[ .[] | select(.mergeStateStatus == "UNKNOWN") ] | length' all.json)"
            if [ "$unknown" -eq 0 ]; then
              break
            fi
            echo "$unknown PR(s) still UNKNOWN; waiting for GitHub (attempt ${attempt}/12)"
            sleep 10
          done

          if [ "$unknown" -ne 0 ]; then
            echo "::warning::${unknown} PR(s) still UNKNOWN after 2 minutes; skipping them this run."
          fi

          # BEHIND means mergeable but not up to date, which a rebase fixes.
          # A PR with a failing check is excluded: rebasing it just re-runs the
          # same failure, and since only a *merge* pushes main and re-triggers
          # this workflow, picking one would stall the queue on a PR that
          # cannot merge.
          jq '[ .[]
                | select(.mergeStateStatus == "BEHIND")
                | select([ .statusCheckRollup[]?
                           | select(.conclusion == "FAILURE"
                                    or .conclusion == "TIMED_OUT"
                                    or .conclusion == "STARTUP_FAILURE"
                                    or .conclusion == "ACTION_REQUIRED") ]
                         | length == 0) ]' all.json > prs.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys

          RANK = {"patch": 0, "minor": 1, "major": 2}

          def bump(a, b):
              pa = [int(x) for x in re.findall(r"\d+", a)[:3]]
              pb = [int(x) for x in re.findall(r"\d+", b)[:3]]
              pa += [0] * (3 - len(pa))
              pb += [0] * (3 - len(pb))
              if pb[0] != pa[0]:
                  return "major"
              return "minor" if pb[1] != pa[1] else "patch"

          def classify(pr):
              """Mirror Kodiak's dep_versions_from_pr: take the largest bump in
              the body so a group containing one major counts as major, and
              fall back to the title for single-dependency PRs.

              Grouped PRs list each member as "Updates `x` from a to b"; the
              leading "Bumps the <group> group with N updates" summary carries
              no version pair, and single-dependency bodies are covered by the
              title fallback."""
              found = re.findall(
                  r"[Uu]pdates? `?([^\s`]+)`? from ([0-9][^\s]*) to ([0-9][^\s]*)",
                  pr.get("body") or "",
              )
              if found:
                  return max((bump(a, b) for _, a, b in found), key=RANK.get)
              m = re.search(r"from ([0-9][^\s]*) to ([0-9][^\s]*)", pr["title"])
              return bump(m.group(1), m.group(2)) if m else None

          # Kodiak's automerge label bypasses merge.automerge_dependencies
          # .versions entirely - the version check lives solely inside its
          # `should_dependency_automerge`, which is skipped once the label is
          # present. So a labelled major *will* be merged, and this workflow
          # must keep it rebased too, or it sits behind main forever waiting
          # for a rebase that nothing is willing to perform.
          #
          # Must match merge.automerge_label in .kodiak.toml, which is unset
          # there and so takes Kodiak's default.
          AUTOMERGE_LABEL = "automerge"

          def labelled(pr):
              return any(
                  l.get("name") == AUTOMERGE_LABEL for l in (pr.get("labels") or [])
              )

          prs = json.load(open("prs.json"))
          eligible = sorted(
              (p for p in prs if labelled(p) or classify(p) in ("minor", "patch")),
              key=lambda p: p["createdAt"],
          )
          by_label = sum(
              1 for p in eligible if labelled(p) and classify(p) not in ("minor", "patch")
          )
          print(f"number={eligible[0]['number'] if eligible else ''}")
          print(
              f"{len(prs)} behind and passing, {len(eligible)} automergeable "
              f"({by_label} by label)",
              file=sys.stderr,
          )
          PY

      - name: Request the rebase and confirm Dependabot accepted it
        if: steps.pick.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pick.outputs.number }}
        run: |
          set -euo pipefail

          # Remember the head so a rebase can be detected directly, and post via
          # the API so the reply window can be anchored to this request rather
          # than guessed. Dependabot's own refusals are durable comments that
          # stay on the PR for months, so "look at the last few comments"
          # matches history: an old "edited by someone other than Dependabot"
          # notice would trigger a recreate even after a rebase had succeeded.
          old_head="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          posted_at="$(gh api "repos/${REPO}/issues/${PR}/comments" \
                         -f body='@dependabot rebase' --jq '.created_at')"
          echo "Requested rebase of #${PR} at ${posted_at} (head ${old_head})"

          # Wait for one of: the branch moving (rebased), or a reply from
          # Dependabot (refused). `since` is server-side and anchored to this
          # request, and the author filter drops our own comment.
          reply=""
          for attempt in $(seq 1 12); do
            sleep 10

            new_head="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
            if [ "$new_head" != "$old_head" ]; then
              echo "Dependabot rebased #${PR} (${old_head:0:7} -> ${new_head:0:7})."
              exit 0
            fi

            reply="$(gh api \
                       "repos/${REPO}/issues/${PR}/comments?since=${posted_at}&per_page=100" \
                       --jq '[ .[]
                               | select(.user.login | test("^dependabot"))
                               | .body ] | join("\n")')"
            if [ -n "$reply" ]; then
              break
            fi
          done

          if [ -z "$reply" ]; then
            echo "::warning::No response from Dependabot within two minutes and"
            echo "#${PR} has not moved. Leaving it for the next run."
            exit 0
          fi

          if printf '%s' "$reply" | grep -qi "only users with push access"; then
            echo "::error::Dependabot rejected the command from this token."
            echo "DEPENDABOT_REBASE_TOKEN must belong to an identity with push"
            echo "access that Dependabot accepts - a bot account is not one."
            exit 1
          fi

          # If anything other than Dependabot has committed to the branch -
          # Kodiak updating it, a pre-commit.ci autofix, a human - Dependabot
          # disowns it and will neither rebase it nor bump it to newer
          # releases. The PR is then stuck behind main forever, because a
          # rebase is the only thing that can make it mergeable and the only
          # actor allowed to rebase it has refused. Recreating discards the
          # foreign commits and rebuilds the branch at the current version,
          # which is the documented escape hatch and the one we used by hand to
          # clear the original backlog.
          if printf '%s' "$reply" | grep -qi "edited by someone other than Dependabot"; then
            echo "::warning::#${PR} was edited by another actor; recreating it."
            gh pr comment "$PR" --repo "$REPO" --body "@dependabot recreate"
            echo "Recreate requested; it will be picked up on a later run."
            exit 0
          fi

          echo "Dependabot replied without refusing; leaving #${PR} to settle."
