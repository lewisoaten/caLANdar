name: Rebase next Dependabot PR

# Kodiak merges with "rebase_fast_forward", which its docs require to be paired
# with "Require branches to be up to date before merging". Every merge therefore
# leaves every other open PR behind main and unmergeable until something rebases
# it, and `update.ignored_usernames` in .kodiak.toml deliberately stops Kodiak
# from being that something - when Kodiak updates a branch, Dependabot disowns
# it and stops bumping it to newer releases, so the PR rots at an old version.
#
# That leaves nobody: Dependabot does not rebase a PR merely for being behind,
# only for conflicts. (Measured here: PRs it has always owned sat up to 29
# commits and six months behind without ever being rebased.)
#
# So ask it to, which keeps the branch Dependabot-owned. This is Kodiak's own
# unimplemented "update by comment" strategy, chdsbd/kodiak#438, from outside.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # `gh pr comment` posts to the issues comments endpoint. Whether
  # pull-requests:write alone authorises that is ambiguous in the docs, and the
  # failure mode is a 403 that looks like "nothing to do", so grant both.
  issues: write

concurrency:
  group: dependabot-rebase
  cancel-in-progress: false

jobs:
  rebase-next:
    runs-on: ubuntu-latest
    steps:
      - name: Check the rebase token is configured
        env:
          REBASE_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
        run: |
          if [ -z "${REBASE_TOKEN}" ]; then
            echo "::error::DEPENDABOT_REBASE_TOKEN is not set."
            echo "Dependabot refuses comment commands from github-actions[bot]:"
            echo '  "Sorry, only users with push access can use that command."'
            echo "That is Dependabot's own identity check, so the default"
            echo "GITHUB_TOKEN cannot work here no matter what permissions it"
            echo "is granted. Provide a PAT or GitHub App token with push"
            echo "access as the DEPENDABOT_REBASE_TOKEN secret."
            exit 1
          fi

      - name: Pick the next mergeable out-of-date Dependabot PR
        id: pick
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Match the author loosely. The same bot is spelled three ways
          # depending on the interface: "dependabot" via GraphQL,
          # "dependabot[bot]" via REST, "app/dependabot" via the gh CLI. A
          # filter matching none of them is indistinguishable from "no work".
          #
          # GitHub computes mergeStateStatus lazily. Querying it starts the
          # computation and returns UNKNOWN until that finishes, and this
          # workflow runs seconds after a merge invalidates every open PR. So
          # poll until the states settle: on the very first real run every PR
          # was UNKNOWN, the BEHIND filter matched nothing, and the job
          # reported "nothing to do" while the queue sat still - a silent
          # no-op of exactly the kind the token guard exists to prevent. The
          # same filter found eleven candidates a minute later.
          unknown=0
          for attempt in $(seq 1 12); do
            gh pr list --repo "$REPO" --state open --limit 100 \
              --json number,title,body,author,mergeStateStatus,createdAt,statusCheckRollup \
              --jq '[ .[]
                      | select(.author.login
                               | test("(^|/)dependabot(\\[bot\\])?$")) ]' \
              > all.json

            unknown="$(jq '[ .[] | select(.mergeStateStatus == "UNKNOWN") ] | length' all.json)"
            if [ "$unknown" -eq 0 ]; then
              break
            fi
            echo "$unknown PR(s) still UNKNOWN; waiting for GitHub (attempt ${attempt}/12)"
            sleep 10
          done

          if [ "$unknown" -ne 0 ]; then
            echo "::warning::${unknown} PR(s) still UNKNOWN after 2 minutes; skipping them this run."
          fi

          # BEHIND means mergeable but not up to date, which a rebase fixes.
          # A PR with a failing check is excluded: rebasing it just re-runs the
          # same failure, and since only a *merge* pushes main and re-triggers
          # this workflow, picking one would stall the queue on a PR that
          # cannot merge.
          jq '[ .[]
                | select(.mergeStateStatus == "BEHIND")
                | select([ .statusCheckRollup[]?
                           | select(.conclusion == "FAILURE"
                                    or .conclusion == "TIMED_OUT"
                                    or .conclusion == "STARTUP_FAILURE"
                                    or .conclusion == "ACTION_REQUIRED") ]
                         | length == 0) ]' all.json > prs.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys

          RANK = {"patch": 0, "minor": 1, "major": 2}

          def bump(a, b):
              pa = [int(x) for x in re.findall(r"\d+", a)[:3]]
              pb = [int(x) for x in re.findall(r"\d+", b)[:3]]
              pa += [0] * (3 - len(pa))
              pb += [0] * (3 - len(pb))
              if pb[0] != pa[0]:
                  return "major"
              return "minor" if pb[1] != pa[1] else "patch"

          def classify(pr):
              """Mirror Kodiak's dep_versions_from_pr: take the largest bump in
              the body so a group containing one major counts as major, and
              fall back to the title for single-dependency PRs.

              Grouped PRs list each member as "Updates `x` from a to b"; the
              leading "Bumps the <group> group with N updates" summary carries
              no version pair, and single-dependency bodies are covered by the
              title fallback."""
              found = re.findall(
                  r"[Uu]pdates? `?([^\s`]+)`? from ([0-9][^\s]*) to ([0-9][^\s]*)",
                  pr.get("body") or "",
              )
              if found:
                  return max((bump(a, b) for _, a, b in found), key=RANK.get)
              m = re.search(r"from ([0-9][^\s]*) to ([0-9][^\s]*)", pr["title"])
              return bump(m.group(1), m.group(2)) if m else None

          prs = json.load(open("prs.json"))
          eligible = sorted(
              (p for p in prs if classify(p) in ("minor", "patch")),
              key=lambda p: p["createdAt"],
          )
          print(f"number={eligible[0]['number'] if eligible else ''}")
          print(
              f"{len(prs)} behind and passing, {len(eligible)} automergeable",
              file=sys.stderr,
          )
          PY

      - name: Request the rebase and confirm Dependabot accepted it
        if: steps.pick.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pick.outputs.number }}
        run: |
          set -euo pipefail
          echo "Requesting rebase of #${PR}"
          gh pr comment "$PR" --repo "$REPO" --body "@dependabot rebase"

          # Dependabot answers a rejected command with a comment rather than an
          # error, so without this the job would go green having achieved
          # nothing. Give it a moment, then look for the refusal.
          sleep 45
          if gh pr view "$PR" --repo "$REPO" --json comments \
               --jq '.comments[-3:][].body' \
             | grep -qi "only users with push access"; then
            echo "::error::Dependabot rejected the command from this token."
            echo "DEPENDABOT_REBASE_TOKEN must belong to an identity with push"
            echo "access that Dependabot accepts - a bot account is not one."
            exit 1
          fi
          echo "Rebase requested; Dependabot did not reject the command."
